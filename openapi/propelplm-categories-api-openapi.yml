openapi: 3.2.0
info:
  title: Propel PIM Categories API
  version: '1.0'
  description: Read API for Propel Product Information Management (PIM) — retrieve published product, variant, category, channel, and digital-asset data for downstream commerce and marketing channels. Derived by API Evangelist from the provider-published PIM Postman collection.
  contact:
    name: Propel Developer Docs
    url: https://developer.propelplm.com/
servers:
- url: '{pimBaseUrl}/api/v1'
  variables:
    pimBaseUrl:
      default: https://pim.propelsoftware.com
      description: Propel PIM base URL for your org
security:
- salesforceOAuth: []
tags:
- name: categories
paths:
  /categories:
    get:
      operationId: getAllCategroies
      summary: Get All Categroies
      tags:
      - categories
      security:
      - salesforceOAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
              - id: <string>
                name: <string>
                categoryId: <string>
                classification: <string>
                parentId: <string>
                isPrimary: <boolean>
                productList:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
                subcategories:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
              - id: <string>
                name: <string>
                categoryId: <string>
                classification: <string>
                parentId: <string>
                isPrimary: <boolean>
                productList:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
                subcategories:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
        '401':
          description: Unauthorized
        '404':
          description: Not found
  /categories/{categoryId}:
    get:
      operationId: getCategoryInfo
      summary: Get Category Info
      tags:
      - categories
      security:
      - salesforceOAuth: []
      parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                id: <string>
                name: <string>
                categoryId: <string>
                classification: <string>
                parentId: <string>
                isPrimary: <boolean>
                productList:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
                subcategories:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
        '401':
          description: Unauthorized
        '404':
          description: Not found
  /categories/{categoryId}/products:
    get:
      operationId: getCategorySProducts
      summary: Get Category's Products
      tags:
      - categories
      security:
      - salesforceOAuth: []
      parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
              - id: <string>
                name: <string>
                category:
                  id: <string>
                  name: <string>
                channels:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
                variants:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
                attributes:
                - status: <string>
                  product_weight: <number>
                  battery_size: <string>
                - status: <string>
                  product_weight: <number>
                  battery_size: <string>
                assets:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
              - id: <string>
                name: <string>
                category:
                  id: <string>
                  name: <string>
                channels:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
                variants:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
                attributes:
                - status: <string>
                  product_weight: <number>
                  battery_size: <string>
                - status: <string>
                  product_weight: <number>
                  battery_size: <string>
                assets:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
        '401':
          description: Unauthorized
        '404':
          description: Not found
components:
  securitySchemes:
    salesforceOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.salesforce.com/services/oauth2/authorize
          tokenUrl: https://login.salesforce.com/services/oauth2/token
          scopes:
            api: API access
