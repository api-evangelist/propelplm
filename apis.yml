name: Propel Software (Propel PLM)
description: >-
  Propel Software is an AI-powered product data platform for manufacturers and product companies,
  unifying Product Lifecycle Management (PLM), Quality Management (QMS), and Product Information
  Management (PIM) on a single system of record built natively on the Salesforce Platform. Propel
  exposes a resource-based REST API (Salesforce Apex REST) for the core PLM objects — Items, Bills of
  Material, Changes/ECOs, and Attachments — plus a bulk Import API and a read-oriented PIM API for
  syndicating product, variant, category, channel, and digital-asset data to commerce and marketing
  channels. All API access is authenticated with Salesforce OAuth 2.0 bearer tokens and executes within
  the requesting user's permission scope. Propel is backed by Norwest Venture Partners.
