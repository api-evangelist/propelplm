openapi: 3.2.0
info:
  title: Propel PIM Products API
  version: '1.0'
  description: Read API for Propel Product Information Management (PIM) — retrieve published product, variant, category, channel, and digital-asset data for downstream commerce and marketing channels. Derived by API Evangelist from the provider-published PIM Postman collection.
  contact:
    name: Propel Developer Docs
    url: https://developer.propelplm.com/
servers:
- url: '{pimBaseUrl}/api/v1'
  variables:
    pimBaseUrl:
      default: https://pim.propelsoftware.com
      description: Propel PIM base URL for your org
security:
- salesforceOAuth: []
tags:
- name: products
paths:
  /products/{productId}:
    get:
      operationId: getProductInfo
      summary: Get Product Info
      tags:
      - products
      security:
      - salesforceOAuth: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                id: <string>
                name: <string>
                category:
                  id: <string>
                  name: <string>
                channels:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
                variants:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
                attributes:
                - status: <string>
                  product_weight: <number>
                  battery_size: <string>
                - status: <string>
                  product_weight: <number>
                  battery_size: <string>
                assets:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
        '401':
          description: Unauthorized
        '404':
          description: Not found
  /products/{productId}/variants:
    get:
      operationId: getProductVariantValue
      summary: Get Product Variant Value
      tags:
      - products
      security:
      - salesforceOAuth: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                id: <string>
                name: <string>
                category:
                  id: <string>
                  name: <string>
                channels:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
                variants:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
                attributes:
                - status: <string>
                  product_weight: <number>
                  battery_size: <string>
                - status: <string>
                  product_weight: <number>
                  battery_size: <string>
                assets:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
        '401':
          description: Unauthorized
        '404':
          description: Not found
  /products/{productId}/attributes:
    get:
      operationId: getProductSAttributeAll
      summary: Get Product's Attribute All
      tags:
      - products
      security:
      - salesforceOAuth: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                id: <string>
                name: <string>
                category:
                  id: <string>
                  name: <string>
                channels:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
                variants:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
                attributes:
                - status: <string>
                  product_weight: <number>
                  battery_size: <string>
                - status: <string>
                  product_weight: <number>
                  battery_size: <string>
                assets:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
        '401':
          description: Unauthorized
        '404':
          description: Not found
  /products/{productId}/attributes/{primaryKey}:
    get:
      operationId: getProductSAttributeOne
      summary: Get Product's Attribute One
      tags:
      - products
      security:
      - salesforceOAuth: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      - name: primaryKey
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                labelId: <string>
                label: <string>
                type: <string>
                valueId: <string>
                value: <string>
                parentProduct:
                  id: <string>
                  name: <string>
                variantValue:
                  id: <string>
                  name: <string>
        '401':
          description: Unauthorized
        '404':
          description: Not found
  /products/{productId}/assets:
    get:
      operationId: getProductSAssets
      summary: Get Product's Assets
      tags:
      - products
      security:
      - salesforceOAuth: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                id: <string>
                name: <string>
                category:
                  id: <string>
                  name: <string>
                channels:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
                variants:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
                attributes:
                - status: <string>
                  product_weight: <number>
                  battery_size: <string>
                - status: <string>
                  product_weight: <number>
                  battery_size: <string>
                assets:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
        '401':
          description: Unauthorized
        '404':
          description: Not found
components:
  securitySchemes:
    salesforceOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.salesforce.com/services/oauth2/authorize
          tokenUrl: https://login.salesforce.com/services/oauth2/token
          scopes:
            api: API access
