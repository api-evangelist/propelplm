openapi: 3.2.0
info:
  title: Propel PIM Variants API
  version: '1.0'
  description: Read API for Propel Product Information Management (PIM) — retrieve published product, variant, category, channel, and digital-asset data for downstream commerce and marketing channels. Derived by API Evangelist from the provider-published PIM Postman collection.
  contact:
    name: Propel Developer Docs
    url: https://developer.propelplm.com/
servers:
- url: '{pimBaseUrl}/api/v1'
  variables:
    pimBaseUrl:
      default: https://pim.propelsoftware.com
      description: Propel PIM base URL for your org
security:
- salesforceOAuth: []
tags:
- name: variants
paths:
  /variants/{variantValueId}:
    get:
      operationId: getVariantValueInfo
      summary: Get Variant Value Info
      tags:
      - variants
      security:
      - salesforceOAuth: []
      parameters:
      - name: variantValueId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                id: <string>
                name: <string>
                label: <string>
                parentProduct:
                  id: <string>
                  name: <string>
                parentVariantValue:
                  id: <string>
                  name: <string>
                childVariantValues:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
        '401':
          description: Unauthorized
        '404':
          description: Not found
  /variants/{variantValueId}/attributes:
    get:
      operationId: getVariantValueSAttributeAll
      summary: Get Variant Value's Attribute All
      tags:
      - variants
      security:
      - salesforceOAuth: []
      parameters:
      - name: variantValueId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                id: <string>
                name: <string>
                label: <string>
                parentProduct:
                  id: <string>
                  name: <string>
                parentVariantValue:
                  id: <string>
                  name: <string>
                childVariantValues:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
        '401':
          description: Unauthorized
        '404':
          description: Not found
  /variants/{variantValueId}/attributes/{primaryKey}:
    get:
      operationId: getVariantValueSAttributeOne
      summary: Get Variant Value's Attribute One
      tags:
      - variants
      security:
      - salesforceOAuth: []
      parameters:
      - name: variantValueId
        in: path
        required: true
        schema:
          type: string
      - name: primaryKey
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                labelId: <string>
                label: <string>
                type: <string>
                valueId: <string>
                value: <string>
                parentProduct:
                  id: <string>
                  name: <string>
                variantValue:
                  id: <string>
                  name: <string>
        '401':
          description: Unauthorized
        '404':
          description: Not found
  /variants/{variantValueId}/assets:
    get:
      operationId: getVariantValueSAssets
      summary: Get Variant Value's Assets
      tags:
      - variants
      security:
      - salesforceOAuth: []
      parameters:
      - name: variantValueId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                id: <string>
                name: <string>
                label: <string>
                parentProduct:
                  id: <string>
                  name: <string>
                parentVariantValue:
                  id: <string>
                  name: <string>
                childVariantValues:
                - id: <string>
                  name: <string>
                - id: <string>
                  name: <string>
        '401':
          description: Unauthorized
        '404':
          description: Not found
components:
  securitySchemes:
    salesforceOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.salesforce.com/services/oauth2/authorize
          tokenUrl: https://login.salesforce.com/services/oauth2/token
          scopes:
            api: API access
