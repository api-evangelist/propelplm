openapi: 3.2.0
info:
  title: Propel PIM Assets API
  version: '1.0'
  description: Read API for Propel Product Information Management (PIM) — retrieve published product, variant, category, channel, and digital-asset data for downstream commerce and marketing channels. Derived by API Evangelist from the provider-published PIM Postman collection.
  contact:
    name: Propel Developer Docs
    url: https://developer.propelplm.com/
servers:
- url: '{pimBaseUrl}/api/v1'
  variables:
    pimBaseUrl:
      default: https://pim.propelsoftware.com
      description: Propel PIM base URL for your org
security:
- salesforceOAuth: []
tags:
- name: assets
paths:
  /assets/{assetId}:
    get:
      operationId: getAssetInfo
      summary: Get Asset Info
      tags:
      - assets
      security:
      - salesforceOAuth: []
      parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                id: <string>
                name: <string>
                fileURL: <string>
                fileType: <string>
                fileSize: <number>
                category:
                  id: <string>
                  name: <string>
                assetRelationships:
                - valueId: <string>
                  linkedRecordName: <string>
                  linkedRecordId: <string>
                  labelName: <string>
                  labelId: <string>
                - valueId: <string>
                  linkedRecordName: <string>
                  linkedRecordId: <string>
                  labelName: <string>
                  labelId: <string>
        '401':
          description: Unauthorized
        '404':
          description: Not found
components:
  securitySchemes:
    salesforceOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.salesforce.com/services/oauth2/authorize
          tokenUrl: https://login.salesforce.com/services/oauth2/token
          scopes:
            api: API access
