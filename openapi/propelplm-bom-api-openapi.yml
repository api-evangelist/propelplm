openapi: 3.2.0
info:
  title: Propel PLM Core REST Bom API
  version: '2.0'
  description: Standard business-logic REST API for Propel PLM, running as a Salesforce Apex REST service. Resource-based endpoints for the core PLM objects — Items, Bills of Material (BOM), Changes, and Attachments. All requests are authenticated with a Salesforce OAuth 2.0 bearer token and execute within the permission scope of the requesting user. Derived by API Evangelist from the provider-published public Postman collection.
  contact:
    name: Propel Developer Docs
    url: https://developer.propelplm.com/
  license:
    name: Proprietary
servers:
- url: https://{orgURL}.salesforce.com/services/apexrest/PDLM/api
  description: Salesforce Apex REST endpoint. orgURL is your org subdomain (e.g. NA85, EU142, or <custom>.my).
  variables:
    orgURL:
      default: NA85
      description: Salesforce org subdomain / My Domain
security:
- salesforceOAuth: []
tags:
- name: Bom
